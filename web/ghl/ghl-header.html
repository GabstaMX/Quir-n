<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap');
.qheader,.qheader *{box-sizing:border-box}
.qheader{--verde:#19493d;--verde-600:#245c4d;--lima:#efff3d;--lima-deep:#dff02a;--papel:#f4f1e8;--linea:#d9d6c8;
  font-family:'DM Sans',system-ui,-apple-system,sans-serif;position:sticky;top:0;z-index:9000;
  background:rgba(244,241,232,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--linea)}
.qheader .qin{max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:24px}
.qheader .qlogo{height:24px;width:auto;display:block}
.qheader .qlinks{display:flex;gap:26px;margin-left:12px}
.qheader .qlinks a{font-size:.92rem;font-weight:500;color:var(--verde);text-decoration:none;position:relative;padding:4px 0}
.qheader .qlinks a::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--lima-deep);border-radius:2px;transform:scaleX(0);transform-origin:left;transition:transform .18s}
.qheader .qlinks a:hover::after,.qheader .qlinks a.qon::after{transform:scaleX(1)}
.qheader .qright{margin-left:auto;display:flex;align-items:center;gap:12px}
.qheader .qcart{display:inline-flex;align-items:center;gap:8px;background:var(--verde);color:#fff;border:0;border-radius:999px;padding:9px 16px;font-size:.85rem;font-weight:500;text-decoration:none;cursor:pointer;transition:background .16s}
.qheader .qcart:hover{background:var(--verde-600)}
.qheader .qcart .qcc{background:var(--lima);color:var(--verde);border-radius:999px;min-width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700}
.qheader .qburger{display:none;background:none;border:0;cursor:pointer;padding:6px;color:var(--verde);line-height:0}
@media(max-width:859px){
  .qheader .qlinks{position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:0;margin:0;background:var(--papel);border-bottom:1px solid var(--linea);padding:6px 24px 16px;display:none}
  .qheader.qopen .qlinks{display:flex}
  .qheader .qlinks a{padding:13px 0;border-bottom:1px solid var(--linea)}
  .qheader .qburger{display:inline-flex}
}
</style>
